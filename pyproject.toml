[project]
name = "stock-bot"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "emoji>=2.15.0",
    "pydantic-settings>=2.14.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
    "yfinance>=1.3.0",
]

[build-system]
requires = ["hatchling >= 1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[project.scripts]
stock-bot = "stock_bot.main:main"
